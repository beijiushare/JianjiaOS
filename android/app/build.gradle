apply plugin: 'com.android.application'
// 启用 Kotlin：ApkUpdaterPlugin.kt 需要（见根 build.gradle 的说明）
apply plugin: 'kotlin-android'

// ---------------------------------------------------------------------------
// 签名配置
//
// 从 android/key.properties 读取，该文件由 CI 在构建时生成（见
// .github/workflows/*.yml 的 "Write signing key" 步骤），本地开发时不存在。
//
// ⚠️ key.jks 与 key.properties 都已被 .gitignore 排除，绝不能提交。
// ⚠️ 这个 key 是「丢了就完蛋」的东西：覆盖安装要求签名一致，key 丢了
//    所有已安装用户必须卸载重装、数据全丢。务必备份到密码管理器。
// ---------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.jianjia.os"
    compileSdk = rootProject.ext.compileSdkVersion

    // Java 21：Capacitor 8 的 capacitor-android 模块声明了
    // sourceCompatibility/targetCompatibility = VERSION_21，
    // 主模块若用更低版本会报 "invalid source release: 21"。
    // 对应地，CI 的 setup-java 也必须装 JDK 21（见 .github/workflows/）。
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
    defaultConfig {
        applicationId "com.jianjia.os"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // 版本号由 CI 注入环境变量（APP_VERSION_CODE = date +%s）。
        // 本地开发不设环境变量时回退到 1 —— 本地构建不分发，无所谓。
        // ⚠️ CI 里必须让这里和 git tag 用同一条命令的同一个值，否则
        //    客户端永远收不到更新（tag 比 APK 大）或每次都被提示（tag 比 APK 小）。
        versionCode Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "1")
        versionName System.getenv("APP_VERSION_NAME") ?: "0.0.0-dev"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // storeFile=key.jks 是相对本 module 目录的，即 android/app/key.jks
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'] ?: 'key.jks')
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        /*
          debug 也挂 release 签名。

          测试包（CI 的 build-test workflow）用 debug 构建 —— 不混淆、日志可读、
          WebView 调试自动开启，便于排查问题。但它必须能被装到已有版本之上，
          所以签名必须和正式包一致，不能沿用 Android 自动生成的 debug key。

          ⚠️ 不加这一段的话，测试包会是另一套签名，覆盖安装正式版时报
             INSTALL_FAILED_UPDATE_INCOMPATIBLE。
        */
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }

        release {
            // 缩体积。APK 大小直接决定更新时下载等多久
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 本地没有 key.properties 时不挂签名配置，否则 gradle 同步就会失败。
            // 这样本地仍能 assembleDebug 调试，只是产不出可发布的 release 包。
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // 按 ABI 分包，同时产出 arm64-v8a 与 armeabi-v7a 两个包。
    // arm64-v8a 覆盖 2015 年后的 64 位设备，armeabi-v7a 兜底老设备。
    // 客户端按 Build.SUPPORTED_ABIS 选择匹配的包（见 update/client.ts 的 pickApk）。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false      // 不额外打通用包
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
