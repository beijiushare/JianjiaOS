name: Build Test APK


on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '展示用版本名（留空则显示 test）'
        required: false
        default: 'test'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # ★ 只取一次：gradle 与 tag 共用同一个值
      - name: Set version
        run: echo "VERSION_CODE=$(date +%s)" >> $GITHUB_ENV

      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build web
        run: npm ci && npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APKs
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: test-apk-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
