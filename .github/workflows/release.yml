name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '展示用版本名，如 0.5.0'
        required: true
      notes:
        description: '更新说明（支持 Markdown，会显示在 App 的更新弹窗里）'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release + push tag 需要

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle


      - name: Set version
        run: echo "VERSION_CODE=$(date +%s)" >> $GITHUB_ENV

      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build web
        run: npm ci && npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APKs
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # app-arm64-v8a-release.apk → JianjiaOS-1.20.0-arm64-v8a.apk

      - name: Rename artifacts
        run: |
          cd android/app/build/outputs/apk/release
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's|app-(.*)-release\.apk|\1|')
            mv "$f" "JianjiaOS-${{ inputs.version_name }}-${abi}.apk"
          done
          ls -la

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: v${{ inputs.version_name }}-build${{ env.VERSION_CODE }}

          name: ${{ inputs.version_name }}
          body: ${{ inputs.notes }}
          files: android/app/build/outputs/apk/release/*.apk

          draft: false
          prerelease: false
